[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
code_size_limit = 98304
ffi = false
fs_permissions = []
extra_output = ["storageLayout", "metadata"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
local = "${LOCAL_RPC_URL}"

[fmt]
line_length = 100
